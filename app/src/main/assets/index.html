<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Siddhary Air Force War 4</title><style>body{margin:0;overflow:hidden;background:#000;font-family:monospace;touch-action:none}canvas{display:block}#ui{position:absolute;top:0;left:0;width:100%;color:white;text-align:center;padding:12px;box-sizing:border-box;display:flex;justify-content:space-between;font-weight:bold;font-size:18px;text-shadow:0 0 5px cyan}#ctrl{position:absolute;bottom:15px;width:100%;display:flex;justify-content:space-between;padding:0 15px;box-sizing:border-box}.btn{width:75px;height:75px;background:rgba(255,255,255,0.15);border:2px solid #00ffff88;border-radius:50%;color:white;font-size:30px;display:flex;align-items:center;justify-content:center}.btn:active{background:rgba(0,255,255,0.3)}#fire{width:90px;height:90px;background:radial-gradient(circle,#ff6600,#ff0000);border-color:yellow;font-size:42px;box-shadow:0 0 20px red}</style></head><body>
<div id="ui"><span>⭐ <span id="score">0</span></span><span>🇮🇳 IAF</span><span>🏆 <span id="hisc">0</span></span></div>
<canvas id="g"></canvas>
<div id="ctrl"><div class="btn" id="lb">◀️</div><div class="btn" id="fire">🔥</div><div class="btn" id="rb">▶️</div></div>
<script>
c=document.getElementById('g');X=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
let p={x:c.width/2,y:c.height-110,s:8},b=[],e=[],ex=[],stars=[],sc=0,hi=localStorage.getItem('iaf_hi')||0;
document.getElementById('hisc').innerText=hi;
for(let i=0;i<90;i++) stars.push({x:Math.random()*c.width,y:Math.random()*c.height,s:Math.random()*2+1,sp:Math.random()*2.5+0.5});
let L=0,R=0;
const AC=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,t,v,d){try{let o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=t;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function shoot(){b.push({x:p.x,y:p.y-25});beep(850,'square',0.4,0.12);if(navigator.vibrate) navigator.vibrate(20)}
function blast(x,y){for(let i=0;i<20;i++) ex.push({x,y,vx:(Math.random()-0.5)*9,vy:(Math.random()-0.5)*9,r:Math.random()*5+2,life:22});beep(140,'sawtooth',0.6,0.35);}
setInterval(()=>{e.push({x:Math.random()*(c.width-50)+25,y:-40,s:2.2+Math.random()*2+sc/120})},600);
function loop(){
X.fillStyle='rgba(0,12,32,0.45)';X.fillRect(0,0,c.width,c.height);
stars.forEach(s=>{s.y+=s.sp;if(s.y>c.height){s.y=0;s.x=Math.random()*c.width}X.fillStyle='white';X.fillRect(s.x,s.y,s.s,s.s)});
if(L)p.x-=p.s;if(R)p.x+=p.s;p.x=Math.max(25,Math.min(c.width-25,p.x));
X.save();X.translate(p.x,p.y);X.fillStyle='#e8e8e8';X.beginPath();X.moveTo(0,-30);X.lineTo(-18,20);X.lineTo(-5,20);X.lineTo(0,10);X.lineTo(5,20);X.lineTo(18,20);X.closePath();X.fill();X.fillStyle='#00e5ff';X.beginPath();X.ellipse(0,-10,6,9,0,0,Math.PI*2);X.fill();X.restore();
X.fillStyle='yellow';b.forEach((o,i)=>{o.y-=12;X.shadowColor='yellow';X.shadowBlur=12;X.fillRect(o.x-2,o.y,4,16);X.shadowBlur=0;if(o.y<0)b.splice(i,1)});
e.forEach((o,i)=>{
o.y+=o.s;X.save();X.translate(o.x,o.y);X.rotate(Math.PI);X.fillStyle='#ff2a2a';X.beginPath();X.moveTo(0,-20);X.lineTo(-13,14);X.lineTo(13,14);X.closePath();X.fill();X.restore();
if(o.y>c.height+30) e.splice(i,1);
if(Math.abs(o.x-p.x)<2&&Math.abs(o.y-p.y)<23){blast(p.x,p.y);setTimeout(()=>{let m=sc>hi?'🔥 NEW HIGH SCORE! 🔥\n':'';alert(m+'💥 MISSION FAILED!\nScore: '+sc+'\nHigh: '+Math.max(sc,hi)+'\n\nFir udega Siddhary!');if(sc>hi)localStorage.setItem('iaf_hi',sc);location.reload()},120);return}
b.forEach((k,j)=>{if(Math.abs(k.x-o.x)<19&&Math.abs(k.y-o.y)<19){blast(o.x,o.y);e.splice(i,1);b.splice(j,1);sc+=10;document.getElementById('score').innerText=sc;if(sc>hi){hi=sc;document.getElementById('hisc').innerText=hi}}});
});
ex.forEach((o,i)=>{o.x+=o.vx;o.y+=o.vy;o.life--;X.fillStyle=i%2==0?'orange':'yellow';X.globalAlpha=o.life/22;X.beginPath();X.arc(o.x,o.y,o.r,0,Math.PI*2);X.fill();X.globalAlpha=1;if(o.life<=0)ex.splice(i,1)});
requestAnimationFrame(loop);
}
document.getElementById('lb').ontouchstart=e=>{e.preventDefault();L=1};document.getElementById('lb').ontouchend=()=>L=0;
document.getElementById('rb').ontouchstart=e=>{e.preventDefault();R=1};document.getElementById('rb').ontouchend=()=>R=0;
document.getElementById('fire').ontouchstart=e=>{e.preventDefault();shoot()};
c.addEventListener('touchmove',ev=>{p.x=ev.touches[0].clientX},{passive:false});
loop();
</script></body></html>
